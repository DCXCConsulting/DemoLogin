<!DOCTYPE html>
<!-- Trace: ACTIVITY-CODE — Sibar mock login POC demo -->
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Accesso — Sibar (dimostrazione)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <div class="demo-banner" role="status">
      Dimostrazione POC — nessun accesso reale. Non inserire credenziali di
      produzione.
    </div>
    <div class="page-wrap">
      <main class="card" aria-labelledby="page-title">
        <div class="brand">
          <h1 id="page-title">Sibar</h1>
          <p>Portale assistenza — accesso dimostrativo</p>
        </div>
        <div id="login-error" class="error-msg" role="alert"></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Nome utente o email</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="checkbox-row">
            <input id="remember" name="remember" type="checkbox" />
            <label for="remember">Ricordami su questo browser (solo sessione)</label>
          </div>
          <button type="submit" id="submit-btn" class="btn">Accedi</button>
        </form>
        <p class="hint">
          Credenziali demo per video: qualsiasi testo non vuoto (es.
          <code>demo</code> / <code>demo</code>). Nessun dato viene inviato a un
          server.
        </p>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
