# Trace: ACTIVITY-CODE — Publish DEMO/ folder to gh-pages for GitHub Pages
name: Deploy DEMO to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "DEMO/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish DEMO to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./DEMO
          publish_branch: gh-pages
          force_orphan: false
